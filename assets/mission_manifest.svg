    <rect x="710" y="14" width="225" height="32" rx="6" fill="#07090e" stroke="#1e293b" />
    <text x="720" y="35" class="td-cmd">cat /etc/passwd | wc</text>
    <rect x="960" y="14" width="100" height="32" rx="16" fill="#34d399" />
    <text x="1010" y="35" class="td-xp">+450 XP</text>
  </g>

