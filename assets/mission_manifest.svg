    <text x="725" y="35" class="td-cmd">cat .mission_brief.txt</text>
    <rect x="960" y="14" width="100" height="32" rx="16" fill="#c084fc" />
    <text x="1010" y="35" class="td-xp">+150 XP</text>
  </g>

  <!-- Row 3 (L3) -->
  <g transform="translate(0, 172)">
    <rect x="10" y="4" width="1080" height="54" rx="8" fill="#161b2e" />
    <rect x="20" y="16" width="32" height="28" rx="6" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1" />
    <text x="36" y="35" fill="#f43f5e" class="td-lvl">03</text>
    <text x="120" y="36" class="td-name">Forensic Log Audit</text>
    <text x="350" y="36" class="td-desc">Search kernel audit trail for [CRITICAL] tags</text>
    <rect x="710" y="14" width="225" height="32" rx="6" fill="#07090e" stroke="#1e293b" />
