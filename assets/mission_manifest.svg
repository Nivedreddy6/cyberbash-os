<svg width="100%" height="680" viewBox="0 0 1100 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tblBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121526" />
      <stop offset="100%" stop-color="#0a0c14" />
    </linearGradient>
    <linearGradient id="hdrBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2640" />
      <stop offset="50%" stop-color="#2a1b3d" />
      <stop offset="100%" stop-color="#162c33" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcee0a" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>
  </defs>

  <style>
    .th-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; fill: #00f0ff; letter-spacing: 0.5px; }
    .td-lvl { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .td-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .td-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .td-cmd { font-family: 'Fira Code', monospace; font-size: 12px; fill: #00f0ff; }
    .td-xp { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 800; fill: #0a0c14; text-anchor: middle; }
  </style>

  <!-- Table Wrapper Container -->
  <rect width="1100" height="680" rx="14" fill="url(#tblBg)" stroke="#2a3158" stroke-width="1.5" />

  <!-- Table Header -->
  <rect x="2" y="2" width="1096" height="48" rx="12" fill="url(#hdrBg)" />
  <text x="35" y="30" class="th-txt" text-anchor="middle">LVL</text>
  <text x="120" y="30" class="th-txt">MISSION CODENAME</text>
  <text x="350" y="30" class="th-txt">TARGET OBJECTIVE</text>
  <text x="730" y="30" class="th-txt">COMMAND SYNTAX</text>
  <text x="1010" y="30" class="th-txt" text-anchor="middle">XP REWARD</text>

  <!-- Row 1 (L1) -->
  <g transform="translate(0, 52)">
    <rect x="10" y="4" width="1080" height="54" rx="8" fill="#161b2e" />
    <rect x="20" y="16" width="32" height="28" rx="6" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1" />
    <text x="36" y="35" fill="#00f0ff" class="td-lvl">01</text>
    <text x="120" y="36" class="td-name">Reconnaissance</text>
    <text x="350" y="36" class="td-desc">Inspect coordinates &amp; reveal hidden dotfiles</text>
    <rect x="710" y="14" width="200" height="32" rx="6" fill="#07090e" stroke="#1e293b" />
    <text x="725" y="35" class="td-cmd">pwd &amp;&amp; ls -la</text>
    <rect x="960" y="14" width="100" height="32" rx="16" fill="#00f0ff" />
    <text x="1010" y="35" class="td-xp">+100 XP</text>
  </g>

  <!-- Row 2 (L2) -->
  <g transform="translate(0, 112)">
    <rect x="10" y="4" width="1080" height="54" rx="8" fill="#131728" />
    <rect x="20" y="16" width="32" height="28" rx="6" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-width="1" />
    <text x="36" y="35" fill="#c084fc" class="td-lvl">02</text>
    <text x="120" y="36" class="td-name">Deciphering Briefs</text>
    <text x="350" y="36" class="td-desc">Extract encrypted brief from .mission_brief.txt</text>
