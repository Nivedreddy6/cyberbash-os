    <rect x="710" y="14" width="200" height="32" rx="6" fill="#07090e" stroke="#1e293b" />
    <text x="725" y="35" class="td-cmd">kill -9 7392</text>
    <rect x="960" y="14" width="100" height="32" rx="16" fill="#fb923c" />
    <text x="1010" y="35" class="td-xp">+250 XP</text>
  </g>

  <!-- Row 5 (L5) -->
  <g transform="translate(0, 292)">
