    <text x="725" y="35" class="td-cmd">chmod 700 .bashrc</text>
    <rect x="960" y="14" width="100" height="32" rx="16" fill="#e879f9" />
    <text x="1010" y="35" class="td-xp">+400 XP</text>
  </g>

  <!-- Row 8 (L8) -->
  <g transform="translate(0, 472)">
