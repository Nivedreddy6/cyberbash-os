    <rect x="20" y="16" width="32" height="28" rx="6" fill="#ff007f" fill-opacity="0.15" stroke="#ff007f" stroke-width="1" />
    <text x="36" y="35" fill="#ff007f" class="td-lvl">09</text>
    <text x="120" y="36" class="td-name">Root Escalation</text>
    <text x="350" y="36" class="td-desc">Elevate terminal session permissions to root admin</text>
    <rect x="710" y="14" width="200" height="32" rx="6" fill="#07090e" stroke="#1e293b" />
    <text x="725" y="35" class="td-cmd">sudo su</text>
    <rect x="960" y="14" width="100" height="32" rx="16" fill="#ff007f" />
    <text x="1010" y="35" class="td-xp">+500 XP</text>
  </g>

  <!-- Row 10 (L10) -->
  <g transform="translate(0, 592)">
    <rect x="10" y="4" width="1080" height="64" rx="8" fill="#1a1e36" stroke="#fcee0a" stroke-width="1.5" />
    <rect x="20" y="18" width="32" height="34" rx="6" fill="#fcee0a" fill-opacity="0.2" stroke="#fcee0a" stroke-width="1.5" />
    <text x="36" y="40" fill="#fcee0a" class="td-lvl" font-size="14">10</text>
    <text x="120" y="41" class="td-name" fill="#fcee0a" font-size="14">👑 Matrix Awakening</text>
    <text x="350" y="41" class="td-desc" fill="#e2e8f0">Benchmark cyber node specs &amp; enter digital rain</text>
    <rect x="710" y="18" width="225" height="34" rx="6" fill="#07090e" stroke="#fcee0a" />
    <text x="720" y="40" class="td-cmd" fill="#fcee0a">neofetch &amp;&amp; matrix</text>
    <rect x="955" y="16" width="115" height="38" rx="19" fill="url(#goldGlow)" />
    <text x="1012" y="40" class="td-xp" font-size="13">+1000 XP</text>
  </g>
