    <text x="120" y="36" class="td-name">Security Patching</text>
    <text x="350" y="36" class="td-desc">Craft emergency security patch via nano editor</text>
    <rect x="710" y="14" width="225" height="32" rx="6" fill="#07090e" stroke="#1e293b" />
    <text x="720" y="35" class="td-cmd">nano notes/patch.txt</text>
    <rect x="960" y="14" width="100" height="32" rx="16" fill="#facc15" />
    <text x="1010" y="35" class="td-xp">+300 XP</text>
  </g>

  <!-- Row 6 (L6) -->
  <g transform="translate(0, 352)">
