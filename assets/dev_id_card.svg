<svg width="100%" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121526" />
      <stop offset="50%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#161b2e" />
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#fcee0a" />
    </linearGradient>
    <linearGradient id="nivedGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="50%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff0033" />
    </linearGradient>
    <filter id="redNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .nived-logo { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 3px; fill: url(#nivedGlow); }
    .card-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.5px; fill: #ffffff; }
    .card-role { font-family: 'Fira Code', monospace; font-size: 12px; fill: #00f0ff; }
    .card-stats { font-family: 'Fira Code', monospace; font-size: 11px; fill: #94a3b8; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
  </style>

  <!-- Outer Cyber Card Container -->
  <rect x="2" y="2" width="846" height="146" rx="16" fill="url(#cardGrad)" stroke="url(#cyberBorder)" stroke-width="1.8" />

  <!-- Avatar HUD Box on Left -->
  <g transform="translate(25, 20)">
    <rect width="110" height="110" rx="12" fill="#05070c" stroke="#ff0055" stroke-width="1.5" />
    <!-- HUD Corners -->
    <path d="M0 15 L0 0 L15 0" stroke="#00f0ff" stroke-width="2.5" fill="none" />
    <path d="M95 0 L110 0 L110 15" stroke="#00f0ff" stroke-width="2.5" fill="none" />
    <path d="M0 95 L0 110 L15 110" stroke="#00f0ff" stroke-width="2.5" fill="none" />
    <path d="M110 95 L110 110 L95 110" stroke="#00f0ff" stroke-width="2.5" fill="none" />
    
    <!-- Red Glowing NIVED Logo matching user's avatar -->
    <text x="55" y="63" text-anchor="middle" class="nived-logo" filter="url(#redNeon)">NIVED</text>
    <circle cx="55" cy="92" r="3.5" fill="#00ff66" />
    <text x="55" y="103" font-family="'Fira Code', monospace" font-size="9" fill="#00ff66" text-anchor="middle">ONLINE</text>
  </g>

  <!-- Developer Identity Info -->
  <g transform="translate(160, 32)">
    <text x="0" y="16" class="card-heading">
      ⚡ <tspan fill="#00f0ff">NIVED</tspan> <tspan fill="#ff007f">REDDY</tspan> <tspan font-size="12" fill="#fcee0a">[ROOT LEAD]</tspan>
    </text>
    <text x="0" y="40" class="card-role">Lead Architect &amp; Creator of CyberBash OS</text>
    <text x="0" y="62" class="card-stats">STACK: Vanilla ES6 &bull; Web Audio API &bull; Virtual Unix VFS</text>
    <text x="0" y="80" class="card-stats">MISSION: Gamified Cyber Security &amp; Interactive Terminal</text>
  </g>

  <!-- Action Badges on Right -->
  <g transform="translate(660, 38)">
    <!-- GitHub Profile Button -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#07090e" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="3" y="3" width="154" height="28" rx="14" fill="#00f0ff" fill-opacity="0.12" />
    <text x="80" y="21" fill="#00f0ff" class="badge-txt">★ GITHUB PROFILE</text>

    <!-- MIT License Button -->
    <rect x="0" y="44" width="160" height="34" rx="17" fill="#07090e" stroke="#00ff66" stroke-width="1.5" />
    <rect x="3" y="47" width="154" height="28" rx="14" fill="#00ff66" fill-opacity="0.12" />
    <text x="80" y="65" fill="#00ff66" class="badge-txt">📜 MIT LICENSED</text>
  </g>
</svg>
