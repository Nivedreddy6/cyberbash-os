<svg width="100%" height="6" viewBox="0 0 1200 6" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="1" />
      <stop offset="75%" stop-color="#fcee0a" stop-opacity="1" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.1" />
    </linearGradient>
    <filter id="laserGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="3" y="1.5" rx="1.5" fill="url(#neonLaser)" filter="url(#laserGlow)" />
</svg>
